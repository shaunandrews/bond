appId: com.bond.app
productName: Bond
copyright: Copyright 2024-2026

directories:
  output: dist
  buildResources: build

mac:
  category: public.app-category.developer-tools
  target:
    - target: dmg
      arch: arm64
  minimumSystemVersion: "12.0"
  icon: build/icon.icns
  hardenedRuntime: false
  gatekeeperAssess: false

dmg:
  title: Bond
  artifactName: Bond-${version}-arm64.dmg

# Don't rebuild native modules — daemon runs under system Node, not Electron
npmRebuild: false

asar: true

# Daemon runs as a separate system Node process, so it lives outside the ASAR.
# Pi is bundled into its entrypoint; only native better-sqlite3 ships beside it.
extraResources:
  # Daemon bundle
  - from: out/daemon
    to: daemon
    filter:
      - "**/*"

  # Browser bundle for remote (LAN) access — the daemon resolves it as ../web
  # relative to its own entrypoint, which holds for out/ and resources/ alike.
  - from: out/web
    to: web
    filter:
      - "**/*"

  # Sense native helpers
  - from: out/daemon/bin/sense
    to: daemon/bin/sense
    filter:
      - "**/*"

  # better-sqlite3 (native addon)
  - from: node_modules/better-sqlite3
    to: daemon/node_modules/better-sqlite3
    filter:
      - package.json
      - "lib/**"
      - build/Release/better_sqlite3.node

  # better-sqlite3 runtime deps
  - from: node_modules/bindings
    to: daemon/node_modules/bindings
    filter:
      - "**/*"
      - "!.github/**"
  - from: node_modules/file-uri-to-path
    to: daemon/node_modules/file-uri-to-path
    filter:
      - "**/*"
      - "!test/**"

files:
  - "!src/**"
  - "!bin/**"
  - "!build/**"
  - "!out/daemon/**"
  - "!.claude/**"
  - "!CLAUDE.md"
  - "!README.md"
  - "!vitest.config.ts"
  - "!tsconfig.json"
  - "!electron-builder.yml"
  - "!electron.vite.config.ts"
