<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <!-- Home Screen web app. The manifest gives iOS a standalone app; the
         apple-* metas are still required alongside it for iOS to honour the
         icon and title. `id`/`start_url` must stay stable — changing them
         makes iOS treat it as a different installed app. -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Bond" />
    <!-- Lets the transcript blend beneath the iPhone status area in the
         installed app instead of being boxed below a black system bar. -->
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="apple-touch-icon" href="/icons/icon-180.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png" />
    <!-- Safari controls the status-bar chrome; these make its opaque fallback
         match the two endpoint colours used by our safe-area fade. -->
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#ffffff" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#000000" />

    <title>Bond</title>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
